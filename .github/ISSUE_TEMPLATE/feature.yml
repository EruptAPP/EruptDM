name: ✨ Feature Request
description: Suggest a new feature or improvement
title: "[FEAT]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! The title already starts with `[FEAT]: ` — just add a short description after the prefix.

  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe your scenario, or what problem this feature would solve.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How would you like this feature to work?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Have you considered any alternative approaches?

  - type: textarea
    id: extra
    attributes:
      label: Additional Context
      description: Screenshots, sketches or related links.
