name: ✨ 功能建议 / Feature Request
description: 提出一个新功能或改进建议
title: "[FEAT]: "
body:
  - type: markdown
    attributes:
      value: |
        感谢建议！标题已自动带上 `[FEAT]: ` 前缀，请直接在其后补充一句简短描述。
        Thanks for the suggestion! Just add a short description after the `[FEAT]: ` title prefix.

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题 / Problem to solve
      description: 描述你遇到的场景，或者这个功能能解决什么问题。
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的方案 / Proposed Solution
      description: 你希望这个功能如何工作？
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案 / Alternatives
      description: 你是否考虑过其他实现方式？

  - type: textarea
    id: extra
    attributes:
      label: 补充信息 / Additional Context
      description: 截图、草图或相关链接。
