name: 🐛 Bug Report
description: Report a reproducible problem
title: "[BUG]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! The title already starts with `[BUG]: ` — just add a short description after the prefix.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the problem and what you expected to happen.
      placeholder: Describe the bug briefly…
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Click …
        3. See error …
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Operating System
      options:
        - macOS
        - Windows
        - Linux
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: App Version
      placeholder: e.g. 2.4.9
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste any relevant error logs or screenshots here.
      render: shell

  - type: textarea
    id: extra
    attributes:
      label: Additional Context
      description: Anything else that helps us track it down (screenshots, links, etc.).
